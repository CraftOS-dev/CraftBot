name: craftbot
channels:
  - conda-forge
  - defaults
# Conda-level runtime only: interpreter, system binaries and pins pip can't
# express. Python packages are NOT listed here — see the pip section below.
dependencies:
  - python=3.10.19
  - pip=26.0.1
  # tesseract binary (pytesseract's backend) — conda-only, no pip wheel.
  - tesseract=5.5.2
  # conda-forge's tesseract build links libcurl.dll but doesn't declare it —
  # without this, tesseract.exe dies with 0xC0000135 (DLL not found) on Windows.
  - libcurl
  # PINNED: openssl 3.6.3 / 3.5.7 regress the Windows cert-store load
  # (ssl.SSLError ASN1: NOT_ENOUGH_DATA in _load_windows_store_certs, crashes
  # aiohttp at import). Broke 2026-06-22 and AGAIN 2026-08-19 when a nodejs
  # install transitively bumped it — keep this pin, verify before raising:
  #   conda run -n craftbot python -c "import ssl; ssl.create_default_context()"
  - openssl=3.6.2
  # Agent App builds: the agent-app CLI is TypeScript run by Node's native type
  # stripping — needs Node >= 24 (older majors ERR_UNKNOWN_FILE_EXTENSION).
  - nodejs>=24
  # Every Python package comes from requirements.txt — the single source for
  # pip mode, conda mode, Docker and the release build. Only add a package to
  # this file if pip cannot provide it (interpreter, system binaries, pins
  # that protect the interpreter itself like openssl above).
  - pip:
      - -r requirements.txt
