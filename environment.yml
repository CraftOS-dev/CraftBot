name: craftbot

# Conda provides the RUNTIME and system-level binaries only.
#
# Python packages are NOT listed here. They come from
# requirements/lock-<platform>-<py>.txt, installed into this env by
# app.provision's python-deps stage — the same lock the pip path and the
# installer use. This file used to carry its own copy of that list and the
# two drifted badly, so `install.py --conda` built a broken environment.
# One list, one lock, no drift.

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.19
  - pip=26.0.1

  # PINNED: openssl 3.6.3 / 3.5.7 regress the Windows cert-store load
  # (ssl.SSLError ASN1: NOT_ENOUGH_DATA in _load_windows_store_certs, crashes
  # aiohttp at import). Broke 2026-06-22 and AGAIN 2026-08-19 when a nodejs
  # install transitively bumped it — keep this pin, verify before raising:
  #   conda run -n craftbot python -c "import ssl; ssl.create_default_context()"
  - openssl=3.6.2

  # Agent App builds: the lui CLI is TypeScript run by Node's native type
  # stripping — needs Node >= 24 (older majors ERR_UNKNOWN_FILE_EXTENSION).
  # Inside the env this leads PATH when CraftBot runs, so node_runtime
  # resolves it and the sidecar download is skipped.
  - nodejs>=24

  # The tesseract BINARY (pytesseract, the Python wrapper, is in the lock).
  # Conda is the only one of our install paths that can provide it.
  - tesseract=5.5.2
