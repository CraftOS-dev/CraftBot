# Egress allowlist proxy for CraftBot containers.
# All container outbound traffic is forced through here; only domains in
# allowlist.txt are permitted, and only on ports 80/443. Everything else is
# denied — so a compromised container cannot scan or attack arbitrary hosts
# (which is what triggered the AWS abuse report).

User tinyproxy
Group tinyproxy

Port 8888
Listen 0.0.0.0
Timeout 600

# Which clients may use the proxy. The container is isolated on a Docker
# `internal` network with the proxy, so only those containers can reach it.
# Tighten to your Docker subnet if you want belt-and-suspenders.
Allow 0.0.0.0/0

# CONNECT (HTTPS tunnel) is allowed ONLY to these ports. This blocks tunnelling
# to SSH (22), mining-pool ports, etc. — a big chunk of abuse traffic dies here.
ConnectPort 443
ConnectPort 80

# Domain allowlist. FilterDefaultDeny Yes => deny everything not matched.
# Patterns are matched against the destination host (FilterURLs Off).
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off

# Don't leak that this is tinyproxy / the client's IP upstream.
DisableViaHeader Yes
