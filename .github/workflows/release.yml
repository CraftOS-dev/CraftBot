name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Build and push Docker images to GHCR
  # ──────────────────────────────────────────────
  docker:
    name: Docker (${{ matrix.image_suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: agent
            dockerfile: Dockerfile
            context: .
          - image_suffix: omniparser
            dockerfile: docker/omniparser/Dockerfile
            context: .
          # 'desktop' image removed: app/gui was deleted with GUI mode
          # (901ad92e) — its Dockerfile no longer exists, and this entry
          # broke the first tag build afterwards.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Build the source payload the installer provisions around.
  # ONE asset for every platform: it is pure Python plus data files. What
  # used to differ per platform (the bundled interpreter, compiled wheels)
  # is provisioned on the user's machine by app.provision.
  # ──────────────────────────────────────────────
  source:
    name: Source payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        env:
          VITE_BACKEND_PORT: "7926"
        run: |
          # Ships compiled into the payload: users have no Node toolchain at
          # install time and must not need one to get a working UI.
          cd app/ui_layer/browser/frontend
          npm install
          npx vite build

      - name: Write VERSION file from git tag
        run: |
          REF="${{ github.ref_name }}"
          echo "${REF#v}" > VERSION

      - name: Create default config.json
        run: |
          echo '{"use_conda": false, "gui_mode_enabled": false}' > config.json

      # A missing lock does not break the BUILD — it breaks the user's
      # install, minutes in and hundreds of MB down. Catch it here instead.
      #
      # Same code the PR check runs, with --require-all promoting "no lock for
      # this platform" from a warning to a failure. The list of shipped
      # platforms lives in that script, so it cannot drift from a second copy
      # written in bash here.
      - name: Require a lock for every platform we ship
        run: python scripts/generate_lock.py --check --require-all

      - name: Build payload
        run: |
          python scripts/package_source.py

      - name: Upload source payload
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/CraftBot-src.zip

  # ──────────────────────────────────────────────
  # Build platform binaries with PyInstaller
  # ──────────────────────────────────────────────
  pyinstaller:
    name: Binary (${{ matrix.os_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux
            data_sep: ":"
            ext: ""
          - os: windows-latest
            os_label: windows
            data_sep: ";"
            ext: ".exe"
          - os: macos-latest
            os_label: macos
            data_sep: ":"
            # A .app is a DIRECTORY, so the macOS artifact is a zip of it.
            ext: ".zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The installer's own build deps (CustomTkinter + PyInstaller) are
          # listed apart from the agent's so the bootstrapper cannot quietly
          # inherit the agent's stack. Tk itself comes with CPython.
          pip install -r packaging/requirements-installer.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        shell: bash
        env:
          VITE_BACKEND_PORT: "7926"
        run: |
          cd app/ui_layer/browser/frontend
          npm install
          npx vite build

      - name: Verify the dependency lock is current
        shell: bash
        run: |
          # A stale lock means users install a dependency set CI never
          # resolved or tested. Fail the release rather than ship it.
          python scripts/generate_lock.py --check

      - name: Create default config.json
        shell: bash
        run: |
          echo "{\"use_conda\": false, \"gui_mode_enabled\": false}" > config.json

      - name: Write VERSION file from git tag
        shell: bash
        run: |
          # github.ref_name is "v1.3.0" for tag pushes; strip the leading 'v'.
          # The installer's _read_bundled_version() reads this to pin the
          # download URL to the matching agent release.
          REF="${{ github.ref_name }}"
          VERSION="${REF#v}"
          echo "$VERSION" > VERSION
          echo "VERSION file content: $(cat VERSION)"

      # The agent is no longer frozen. It used to be built here as a
      # per-platform PyInstaller bundle (~408 MB zipped, 2.3 GB on disk);
      # the installer now fetches a 17 MB source payload and provisions an
      # interpreter and the locked dependencies around it. That is what makes
      # an installed CraftBot the same thing as a source checkout instead of
      # a separate artifact with its own bugs.
      # See docs/plans/unified-install-architecture.md.

      # PyInstaller's BUNDLE wants a .icns; the repo ships .ico and .png.
      # sips and iconutil are both part of macOS, so this needs nothing
      # installed. The spec falls back to no icon if the file is absent, which
      # is what happens on a local build.
      - name: Build the macOS app icon
        if: matrix.os_label == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          iconset="$RUNNER_TEMP/craftbot.iconset"
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size craftbot_logo_1.png \
                 --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) craftbot_logo_1.png \
                 --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o craftbot_logo_1.icns
          ls -la craftbot_logo_1.icns

      - name: Build installer (CraftBotInstaller) with PyInstaller
        shell: bash
        run: pyinstaller --noconfirm --clean packaging/CraftBotInstaller.spec

      - name: Package installer artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os_label }}" = "macos" ]; then
            # ditto, not zip: it preserves the bundle's symlinks, extended
            # attributes and execute bits. A plain zip loses them and the
            # app will not launch after the user unzips it.
            ditto -c -k --keepParent \
              "dist/CraftBotInstaller.app" \
              "dist/CraftBotInstaller-macos.zip"
          else
            mv "dist/CraftBotInstaller${{ matrix.ext }}" \
               "dist/CraftBotInstaller-${{ matrix.os_label }}${{ matrix.ext }}"
          fi
          ls -la dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.os_label }}
          path: dist/CraftBotInstaller-${{ matrix.os_label }}${{ matrix.ext }}


  # ──────────────────────────────────────────────
  # Create GitHub Release with all artifacts
  # ──────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [docker, source, pyinstaller]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
          body: |
            ### Installer (Recommended)
            Download the file for your platform from the assets below and run
            it. The wizard lets you choose an install location, then downloads
            `CraftBot-src.zip` from this release and sets up everything it
            needs — Python, Node.js and all dependencies. You do not need Git,
            Python or Node installed beforehand.

            | Platform | Download | How to run |
            |---|---|---|
            | Windows | `CraftBotInstaller-windows.exe` | Double-click it. |
            | macOS | `CraftBotInstaller-macos.zip` | Unzip, then **right-click the app and choose Open**. |
            | Linux | `CraftBotInstaller-linux` | `chmod +x CraftBotInstaller-linux && ./CraftBotInstaller-linux` |

            On macOS the right-click is required the first time: the app is not
            yet signed with an Apple Developer ID, so double-clicking it shows
            "cannot be opened because the developer cannot be verified".
            Right-click → Open gives you an Open button that double-click does
            not. You only need to do this once.

            First install takes a few minutes while the runtime is prepared.

            ### Manual install
            If you'd rather skip the wizard, download both
            `CraftBotInstaller-<platform>` and `CraftBot-src.zip`, place them
            in the same folder, and run the installer — it'll use the local
            payload instead of fetching from GitHub.