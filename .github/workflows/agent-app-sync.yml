name: Agent-App host binding

on:
  pull_request:
    paths:
      - 'app/agent_app/**'
      - 'app/agent_app_package.py'
      - 'app/vendor/agent-app/**'
      - 'app/data/default_agent_app/**'
      - 'app/provision/**'
      - 'app/references/**'
      - 'app/agent_base.py'
      - 'app/database_interface.py'
      - 'scripts/*agent_app*'
      - 'scripts/*kanban*'
      - 'app/data/action/agent_app*'
      - 'agent_core/**'
      - 'app/triggers/**'
      - 'app/ui_layer/**'
      - 'tests/test_agent_app_framework*'
      - 'tests/test_default_agent_app.py'
      - 'tests/test_static_frontend.py'
      - 'run.py'
      - 'tests/references/**'
      - 'tests/fixtures/framework-*'
      - 'requirements/test-agent-app-sync.txt'
      - '.github/workflows/agent-app-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/test-agent-app-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install -r requirements/test-agent-app-sync.txt
      - uses: actions/checkout@v4
        with:
          repository: CraftOS-dev/Agent-App
          ref: 06622d24ca9d4c579230977774b3a9dbbb40dcdf
          path: .ci-agent-app
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm --dir .ci-agent-app install --frozen-lockfile
      - run: pnpm --dir .ci-agent-app --filter '@a2app/adapter-core...' build
      - name: Real bundled commands, package installs, source extraction and task handoff
        env:
          CRAFTBOT_TEST_ADAPTER_ENTRY: ${{ github.workspace }}/.ci-agent-app/adapters/adapter-core/dist/index.js
          CRAFTBOT_TEST_BUNDLED_BOARD: '1'
        run: >-
          python -m pytest --import-mode=importlib -q
          tests/test_agent_app_package.py
          tests/test_agent_app_framework_cli.py
          tests/test_agent_app_framework_actions.py
          tests/test_agent_app_framework_host.py
          tests/test_agent_app_framework_verification.py
          tests/test_agent_app_framework_reset.py
          tests/test_agent_app_framework_maintenance.py
          tests/test_agent_app_framework_sharing.py
          tests/test_agent_app_framework_bridge.py
          tests/test_agent_app_framework_task_sessions.py
          tests/test_agent_app_framework_native.py
          tests/test_agent_app_framework_bundled_board.py
          tests/test_agent_app_framework_install.py
          tests/test_agent_app_framework_profile.py
          tests/test_agent_app_framework_isolation.py
          tests/test_agent_app_framework_migration.py
          tests/test_agent_app_framework_references.py
          tests/test_agent_app_framework_lifecycle.py
          tests/test_agent_app_framework_open.py
          tests/test_agent_app_registry_list.py
          tests/test_default_agent_app.py
          tests/test_static_frontend.py
          tests/references

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui_layer/browser/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/test-agent-app-sync.txt
      - run: python -m pip install -r ../../../../requirements/test-agent-app-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui_layer/browser/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright test tests/framework-host.test.ts tests/framework-app-list.test.ts tests/framework-app-open.test.ts tests/framework-request-flow.test.ts tests/framework-app-lifecycle.test.ts tests/framework-app-settings.test.ts tests/framework-app-menu.test.ts tests/panel-agent-apps.test.ts tests/references.test.ts tests/references.edge-cases.test.ts --workers=4
      - name: Settings and embedded app against the real host and bundled CLI
        env:
          CRAFTBOT_TEST_PYTHON: python
        run: npx playwright test tests/framework-settings-live.test.ts tests/framework-board-live.test.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: app/ui_layer/browser/frontend/test-results
