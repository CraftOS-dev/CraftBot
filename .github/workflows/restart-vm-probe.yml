name: Reboot VM capability probe

on:
  push:
    branches: [fix/system-restart-auto-launch]
    paths: ['.github/workflows/restart-vm-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-hypervisor:
    # Standard runners are free for this public repository. Check an Intel
    # runner explicitly: Apple Silicon runners do not expose nested macOS VMs.
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Inspect available virtualization
        run: |
          sw_vers
          uname -m
          sysctl kern.hv_support
          df -h /
          cat > "$RUNNER_TEMP/hv-probe.c" <<'EOF'
          #include <Hypervisor/Hypervisor.h>
          #include <stdio.h>
          int main(void) {
              hv_return_t result = hv_vm_create(HV_VM_DEFAULT);
              printf("hv_vm_create: 0x%x\n", result);
              if (result == HV_SUCCESS) {
                  printf("hv_vm_destroy: 0x%x\n", hv_vm_destroy());
              }
              return 0;
          }
          EOF
          cat > "$RUNNER_TEMP/hv-entitlements.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>
          EOF
          clang "$RUNNER_TEMP/hv-probe.c" -framework Hypervisor -o "$RUNNER_TEMP/hv-probe"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/hv-entitlements.plist" "$RUNNER_TEMP/hv-probe"
          "$RUNNER_TEMP/hv-probe"

  macos-reboot:
    # A disposable standard runner is itself a VM. Determine whether evidence
    # can survive its reboot before attempting the full installation tests.
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare independent evidence uploader
        run: |
          mkdir -p "$RUNNER_TEMP/reboot-probe"
          cd "$RUNNER_TEMP/reboot-probe"
          npm install --no-audit --no-fund @actions/artifact@2
          cp "$GITHUB_WORKSPACE/scripts/macos_reboot_probe.cjs" .
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const path = require('path');
            const root = path.join(process.env.RUNNER_TEMP, 'reboot-probe');
            const env = {};
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_URL', 'GITHUB_RUN_ID']) {
              if (process.env[key]) env[key] = process.env[key];
            }
            fs.writeFileSync(path.join(root, 'runtime.json'), JSON.stringify(env), {mode: 0o600});
            fs.writeFileSync(path.join(root, 'before.json'), JSON.stringify({
              boot: cp.execFileSync('/usr/sbin/sysctl', ['-n', 'kern.bootsessionuuid'], {encoding:'utf8'}).trim(),
              user: cp.execFileSync('/usr/bin/stat', ['-f', '%Su', '/dev/console'], {encoding:'utf8'}).trim()
            }));
            const plist = `<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict>
            <key>Label</key><string>com.craftbot.reboot-probe</string>
            <key>UserName</key><string>runner</string>
            <key>RunAtLoad</key><true/>
            <key>ProgramArguments</key><array><string>${process.execPath}</string><string>${root}/macos_reboot_probe.cjs</string></array>
            <key>StandardOutPath</key><string>${root}/probe.log</string>
            <key>StandardErrorPath</key><string>${root}/probe.err</string>
            </dict></plist>`;
            fs.writeFileSync(path.join(root, 'probe.plist'), plist);
            cp.execFileSync('sudo', ['cp', path.join(root, 'probe.plist'), '/Library/LaunchDaemons/com.craftbot.reboot-probe.plist']);
            cp.execFileSync('sudo', ['chown', 'root:wheel', '/Library/LaunchDaemons/com.craftbot.reboot-probe.plist']);
            cp.execFileSync('sudo', ['chmod', '644', '/Library/LaunchDaemons/com.craftbot.reboot-probe.plist']);
            cp.execFileSync('sudo', ['launchctl', 'bootstrap', 'system', '/Library/LaunchDaemons/com.craftbot.reboot-probe.plist']);
      - name: Reboot disposable Mac VM
        run: |
          echo 'Rebooting this disposable VM. The independent LaunchDaemon will upload the changed boot identity.'
          sudo shutdown -r +1
          sleep 600
