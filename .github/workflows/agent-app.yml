name: agent-app

# Self-test for the Agent App TEMPLATE code (kit/blueprint/tools) in this repo.
# Scaffolds a throwaway project and runs the local validation gate on it.
# User-made Agent Apps never touch this workflow — they validate locally.

on:
  push:
    paths:
      - 'agent-app/**'
      - '.github/workflows/agent-app.yml'
  pull_request:
    paths:
      - 'agent-app/**'
      - '.github/workflows/agent-app.yml'

defaults:
  run:
    working-directory: agent-app

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache PocketBase binary
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/craftos-agent-app/pb
            ~/.cache/craftos-agent-app/pb
            ~\AppData\Local\craftos-agent-app\pb
          key: pb-${{ runner.os }}-${{ hashFiles('agent-app/spec/pocketbase.version') }}

      - name: Install workspace
        run: npm install

      - name: Typecheck (kit + tools)
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Scaffold demo project
        run: node tools/src/cli.ts create "CI Demo" --description "CI validation project" --port 8090

      - name: Link demo workspace
        run: npm install

      - name: Validation gate
        run: node tools/src/cli.ts validate examples/ci-demo
