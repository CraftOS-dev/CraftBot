name: Disposable Mac reboot lab

on:
  push:
    branches: [fix/system-restart-auto-launch]
    paths: ['.github/workflows/restart-mac-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-mac:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install VM and temporary controller tools
        run: |
          brew install qemu cloudflared
          mkdir -p "$RUNNER_TEMP/mac-lab"
          cd "$RUNNER_TEMP/mac-lab"
          npm install --no-audit --no-fund ws@8
      - name: Start key-authenticated disposable controller
        run: |
          cd "$RUNNER_TEMP/mac-lab"
          cp "$GITHUB_WORKSPACE/scripts/restart-controller.pub" authorized_keys
          chmod 600 authorized_keys
          ssh-keygen -q -t ed25519 -N '' -f host_key
          cat > sshd_config <<EOF
          Port 22022
          ListenAddress 127.0.0.1
          HostKey $RUNNER_TEMP/mac-lab/host_key
          AuthorizedKeysFile $RUNNER_TEMP/mac-lab/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers runner
          UsePAM no
          PidFile $RUNNER_TEMP/mac-lab/sshd.pid
          Subsystem sftp /usr/libexec/sftp-server
          EOF
          sudo /usr/sbin/sshd -f "$PWD/sshd_config" -E "$PWD/sshd.log"
          cat > relay.cjs <<'EOF'
          const {WebSocketServer} = require('ws');
          const net = require('net');
          new WebSocketServer({host:'127.0.0.1', port:9090}).on('connection', ws => {
            const tcp = net.createConnection({host:'127.0.0.1',port:22022});
            ws.on('message', data => tcp.write(data));
            tcp.on('data', data => { if(ws.readyState===1) ws.send(data); });
            tcp.on('error', () => ws.close());
            ws.on('error', () => tcp.destroy());
            ws.on('close', () => tcp.destroy());
            tcp.on('close', () => ws.close());
          });
          EOF
          node relay.cjs > relay.log 2>&1 &
          cloudflared tunnel --url http://127.0.0.1:9090 --no-autoupdate > tunnel.log 2>&1 &
          for i in {1..30}; do
            if grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' tunnel.log > endpoint.txt; then break; fi
            sleep 2
          done
          test -s endpoint.txt
          cp host_key.pub controller-host-key.pub
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-mac-controller
          path: |
            ${{ runner.temp }}/mac-lab/endpoint.txt
            ${{ runner.temp }}/mac-lab/controller-host-key.pub
          retention-days: 1
      - name: Run bounded nested VM validation session
        run: |
          for i in {1..330}; do
            if test -f "$RUNNER_TEMP/mac-lab/done"; then exit 0; fi
            sleep 30
          done
          echo 'Validation session timed out'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-nested-reboot-evidence
          path: ${{ runner.temp }}/mac-lab/evidence/
          retention-days: 7
