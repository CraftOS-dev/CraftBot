name: Launcher

# CI for the native launcher in launcher/ (Rust + Slint). The Release
# workflow builds and ships it; this one catches breakage on the way there,
# on every platform the launcher is shipped for.

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against the oldest supported glibc, not the moving latest
          # runner (whose binaries cannot launch on older Ubuntu releases).
          - os: ubuntu-22.04
            os_label: linux
          - os: windows-latest
            os_label: windows
          - os: macos-latest
            os_label: macos

    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os_label == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      # Same insurance as the Release workflow: Slint has no C build deps,
      # but a few crates probe for these headers.
      - name: Linux build prerequisites
        if: matrix.os_label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Format
        if: matrix.os_label == 'linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os_label == 'linux'
        run: cargo clippy --release -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Build universal Mac installer for reboot validation
        if: matrix.os_label == 'macos' && (github.head_ref == 'fix/system-restart-auto-launch' || github.ref_name == 'fix/system-restart-auto-launch')
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create target/release/CraftBotInstaller target/x86_64-apple-darwin/release/CraftBotInstaller -output target/release/CraftBotInstaller-universal
          mv target/release/CraftBotInstaller-universal target/release/CraftBotInstaller
          lipo -info target/release/CraftBotInstaller

      - name: Save installers for disposable reboot tests
        if: github.head_ref == 'fix/system-restart-auto-launch' || github.ref_name == 'fix/system-restart-auto-launch'
        uses: actions/upload-artifact@v4
        with:
          name: reboot-installer-${{ matrix.os_label }}
          path: launcher/target/release/CraftBotInstaller${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7
