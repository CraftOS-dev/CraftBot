# CraftBot in a container (browser mode).
#
#   docker compose up -d        then open http://localhost:7925
#
# The first start asks for an LLM API key in the browser. Settings, API keys,
# agent files, memory and logs are kept in the craftbot-data volume, so they
# survive restarts, `docker compose down` and image rebuilds.
#
# Optional network settings (proxy, mirrors) are read from your shell or from
# a .env file next to this one; see .env.example.

services:
  craftbot:
    build:
      context: .
      args:
        # Mirrors for the image build; empty means the public registries.
        - PIP_INDEX_URL
        - npm_config_registry
    image: craftbot:local
    container_name: craftbot
    ports:
      # Loopback only: the CraftBot UI has no login of its own. For a remote
      # server, keep it this way and connect through an SSH tunnel.
      # Keep the host ports equal to the container ports: the UI calls the
      # backend on 7926, and CraftBot only accepts requests addressed to
      # localhost.
      - "127.0.0.1:7925:7925"
      - "127.0.0.1:7926:7926"
    volumes:
      - craftbot-data:/data
    environment:
      # Passed through only when set in your shell or .env.
      - HTTPS_PROXY
      - HTTP_PROXY
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      - PIP_INDEX_URL
      - npm_config_registry
      - HF_ENDPOINT
      - CRAFTBOT_MIRRORS
    # Chromium (Mini Browser, browser automation) needs more shared memory
    # than Docker's 64 MB default.
    shm_size: "1gb"
    security_opt:
      # A process inside cannot gain privileges it did not start with.
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  craftbot-data:
